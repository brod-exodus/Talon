name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0

      - name: Apply migrations to a fresh Supabase database
        run: |
          workdir="$RUNNER_TEMP/talon-supabase"
          mkdir -p "$workdir"
          supabase init --workdir "$workdir"
          node --experimental-strip-types scripts/prepare-supabase-migrations.ts "$workdir/supabase/migrations"
          supabase db start --workdir "$workdir"

      - name: Exercise durable worker fault recovery
        run: |
          set -o pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --no-psqlrc \
            --file tests/integration/worker-fault-injection.sql \
            2>&1 | tee "$RUNNER_TEMP/worker-fault-injection.log"

      - name: Verify workspace lifecycle preview
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --no-psqlrc \
            --file tests/integration/workspace-lifecycle-preview.sql

      - name: Verify workspace data export
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --no-psqlrc \
            --file tests/integration/workspace-data-export.sql

      - name: Verify workspace deletion
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --no-psqlrc \
            --file tests/integration/workspace-deletion.sql

      - name: Upload worker fault-injection trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-fault-injection-trace
          path: ${{ runner.temp }}/worker-fault-injection.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase database
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/talon-supabase" --no-backup

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_ROLE_KEY: dummy
      TALON_ADMIN_PASSWORD: dummy
      TALON_SESSION_SECRET: dummy
      GITHUB_TOKEN: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Require applied production migrations
        if: github.event_name == 'pull_request'
        env:
          TALON_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TALON_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TALON_PR_BODY: ${{ github.event.pull_request.body }}
        run: node --experimental-strip-types scripts/check-pr-migration-readiness.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Verify
        run: pnpm verify

      - name: Capacity benchmark
        run: pnpm benchmark:capacity -- --json > capacity-benchmark.json

      - name: Worker concurrency benchmark
        run: pnpm benchmark:concurrency -- --json > worker-concurrency-benchmark.json

      - name: Upload capacity benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-benchmark
          path: capacity-benchmark.json
          retention-days: 7

      - name: Upload worker concurrency benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-concurrency-benchmark
          path: worker-concurrency-benchmark.json
          retention-days: 7

      - name: Build
        run: pnpm build

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload browser-test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
