name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.114.0

      - name: Apply migrations to a fresh Supabase database
        run: |
          workdir="$RUNNER_TEMP/talon-supabase"
          mkdir -p "$workdir"
          supabase init --workdir "$workdir"
          node --experimental-strip-types scripts/prepare-supabase-migrations.ts "$workdir/supabase/migrations"
          supabase db start --workdir "$workdir"

      - name: Exercise durable worker fault recovery
        run: |
          set -o pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --no-psqlrc \
            --file tests/integration/worker-fault-injection.sql \
            2>&1 | tee "$RUNNER_TEMP/worker-fault-injection.log"

      - name: Verify workspace lifecycle preview
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --no-psqlrc \
            --file tests/integration/workspace-lifecycle-preview.sql

      - name: Verify workspace data export
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --no-psqlrc \
            --file tests/integration/workspace-data-export.sql

      - name: Upload worker fault-injection trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-fault-injection-trace
          path: ${{ runner.temp }}/worker-fault-injection.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase database
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/talon-supabase" --no-backup

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_ROLE_KEY: dummy
      TALON_ADMIN_PASSWORD: dummy
      TALON_SESSION_SECRET: dummy
      GITHUB_TOKEN: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Verify
        run: pnpm verify

      - name: Capacity benchmark
        run: pnpm benchmark:capacity -- --json > capacity-benchmark.json

      - name: Worker concurrency benchmark
        run: pnpm benchmark:concurrency -- --json > worker-concurrency-benchmark.json

      - name: Upload capacity benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capacity-benchmark
          path: capacity-benchmark.json
          retention-days: 7

      - name: Upload worker concurrency benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-concurrency-benchmark
          path: worker-concurrency-benchmark.json
          retention-days: 7

      - name: Build
        run: pnpm build

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload browser-test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
