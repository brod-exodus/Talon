name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.114.0

      - name: Apply migrations to a fresh Supabase database
        run: |
          workdir="$RUNNER_TEMP/talon-supabase"
          mkdir -p "$workdir"
          supabase init --workdir "$workdir"
          node --experimental-strip-types scripts/prepare-supabase-migrations.ts "$workdir/supabase/migrations"
          supabase db start --workdir "$workdir"

      - name: Stop local Supabase database
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/talon-supabase" --no-backup

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_ROLE_KEY: dummy
      TALON_ADMIN_PASSWORD: dummy
      TALON_SESSION_SECRET: dummy
      GITHUB_TOKEN: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build
