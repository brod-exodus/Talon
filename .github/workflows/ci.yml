name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0

      - name: Apply migrations to a fresh Supabase database
        run: |
          workdir="$RUNNER_TEMP/talon-supabase"
          mkdir -p "$workdir"
          supabase init --workdir "$workdir"
          node --experimental-strip-types scripts/prepare-supabase-migrations.ts "$workdir/supabase/migrations"
          supabase db start --workdir "$workdir"

      - name: Stop local Supabase database
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/talon-supabase" --no-backup

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_ROLE_KEY: dummy
      TALON_ADMIN_PASSWORD: dummy
      TALON_SESSION_SECRET: dummy
      GITHUB_TOKEN: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build
